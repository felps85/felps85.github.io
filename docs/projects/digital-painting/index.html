    <script>
      (() => {
        const namespace = "felip-eu-portfolio";
        const trackedRoutes = new Set();
        const queueStorageKey = "__fs_analytics_queue__:" + namespace;
        let flushTimer = null;
        let isFlushingQueue = false;

        function normalizeRoute(route) {
          const trimmed = (route || "/").replace(/\/index\.html$/, "/").replace(/\/+/g, "/");
          if (trimmed === "/" || trimmed === "") return "/";
          return trimmed.endsWith("/") ? trimmed : trimmed + "/";
        }

        function counterName(route) {
          const normalized = normalizeRoute(route);
          if (normalized === "/") return "home";
          return normalized
            .replace(/^\//, "")
            .replace(/\/$/, "")
            .toLowerCase()
            .replace(/[^a-z0-9/_-]+/g, "-")
            .replace(/\//g, "__");
        }

        function activeCounterName(route) {
          return counterName(route) + "__active";
        }

        function readQueue() {
          try {
            const raw = window.localStorage.getItem(queueStorageKey);
            if (!raw) return {};
            const parsed = JSON.parse(raw);
            return parsed && typeof parsed === "object" ? parsed : {};
          } catch {
            return {};
          }
        }

        function writeQueue(queue) {
          try {
            const entries = Object.entries(queue).filter(([, count]) => Number(count) > 0);
            if (!entries.length) {
              window.localStorage.removeItem(queueStorageKey);
              return;
            }

            window.localStorage.setItem(queueStorageKey, JSON.stringify(Object.fromEntries(entries)));
          } catch {}
        }

        function enqueueCounter(name, count = 1) {
          const queue = readQueue();
          queue[name] = Number(queue[name] || 0) + count;
          writeQueue(queue);
        }

        function scheduleQueueFlush(delay = 1500) {
          if (flushTimer) return;
          flushTimer = window.setTimeout(() => {
            flushTimer = null;
            flushQueuedCounters();
          }, delay);
        }

        function sendCounter(name) {
          const url =
            "https://api.counterapi.dev/v1/" +
            encodeURIComponent(namespace) +
            "/" +
            encodeURIComponent(name) +
            "/up";

          return fetch(url, { method: "GET", keepalive: true, cache: "no-store" }).then((response) => {
            if (!response.ok) throw new Error("Bad response");
          });
        }

        async function flushQueuedCounters() {
          if (isFlushingQueue) return;
          if ("onLine" in navigator && !navigator.onLine) {
            scheduleQueueFlush();
            return;
          }

          const queue = readQueue();
          const entries = Object.entries(queue).filter(([, count]) => Number(count) > 0);
          if (!entries.length) return;

          isFlushingQueue = true;

          try {
            const nextQueue = { ...queue };

            for (const [name, count] of entries) {
              let sent = 0;

              while (sent < count) {
                try {
                  await sendCounter(name);
                  sent += 1;
                } catch {
                  break;
                }
              }

              const remaining = count - sent;
              if (remaining > 0) {
                nextQueue[name] = remaining;
              } else {
                delete nextQueue[name];
              }
            }

            writeQueue(nextQueue);

            if (Object.keys(nextQueue).length) {
              scheduleQueueFlush();
            }
          } finally {
            isFlushingQueue = false;
          }
        }

        function pingCounter(name) {
          enqueueCounter(name);
          flushQueuedCounters();
        }

        const activeBucketMs = 10 * 1000;
        let activeRoute = null;
        let activeStartedAt = 0;
        let activeCarryMs = 0;
        let activeTimer = null;

        function flushActiveTime(finalize = false) {
          if (!activeRoute || !activeStartedAt) return;

          const now = Date.now();
          activeCarryMs += Math.max(0, now - activeStartedAt);
          activeStartedAt = now;

          while (activeCarryMs >= activeBucketMs) {
            pingCounter(activeCounterName(activeRoute));
            activeCarryMs -= activeBucketMs;
          }

          if (finalize && activeCarryMs >= activeBucketMs / 2) {
            pingCounter(activeCounterName(activeRoute));
            activeCarryMs = 0;
          }
        }

        function stopActiveTimer(finalize = false) {
          flushActiveTime(finalize);
          activeStartedAt = 0;
          if (activeTimer) {
            clearInterval(activeTimer);
            activeTimer = null;
          }
        }

        function ensureActiveTimer() {
          if (document.visibilityState !== "visible" || activeTimer) return;
          activeTimer = setInterval(() => flushActiveTime(false), activeBucketMs);
        }

        function setActiveRoute(route) {
          const normalized = normalizeRoute(route);
          const changedRoute = activeRoute !== normalized;

          if (changedRoute) {
            stopActiveTimer(true);
            activeRoute = normalized;
            activeCarryMs = 0;
          }

          if (document.visibilityState === "visible") {
            activeStartedAt = Date.now();
            ensureActiveTimer();
          }
        }

        function trackPageView(route) {
          const normalized = normalizeRoute(route);
          if (!trackedRoutes.has(normalized)) {
            trackedRoutes.add(normalized);
            pingCounter(counterName(normalized));
          }

          setActiveRoute(normalized);
        }

        window.__FS_ANALYTICS__ = {
          namespace,
          trackPageView,
          setActiveRoute
        };

        document.addEventListener("visibilitychange", () => {
          if (document.visibilityState === "hidden") {
            stopActiveTimer(true);
            return;
          }

          if (activeRoute) {
            activeStartedAt = Date.now();
            ensureActiveTimer();
          }

          flushQueuedCounters();
        });

        window.addEventListener("pagehide", () => stopActiveTimer(true));
        window.addEventListener("online", () => flushQueuedCounters());

        trackPageView(window.location.pathname);
        flushQueuedCounters();
      })();
    </script>
