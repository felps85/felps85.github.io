<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Simple page analytics for Felipe Soares portfolio." />
    <title>Analytics | Felipe Soares</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Raleway:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body>
    
  <div class="page-shell">
    
    <header class="site-header">
      <a class="brand" aria-label="Felipe Soares" href="../../index.html">FS<span class="brand-dot">.</span></a>
      <nav class="site-nav" aria-label="Primary">
        <a href="../../index.html#design">Design</a>
        <a href="../../index.html#about">About</a>
        <a href="../../index.html#contact">Contact</a>
      </nav>
    </header>
  
    <main class="analytics-page">
      <section class="analytics-hero">
        <p class="eyebrow">Analytics</p>
        <h1>Simple page analytics</h1>
        <p class="analytics-note" id="analytics-note"></p>
      </section>

      <section class="analytics-panel">
        <div class="analytics-views" id="analytics-views" role="tablist" aria-label="Analytics views"></div>
        <div class="analytics-total-card">
          <span>Total tracked views</span>
          <strong id="analytics-total">...</strong>
        </div>
        <div class="analytics-toolbar">
          <label class="analytics-search">
            <span class="analytics-search-label">Find a page</span>
            <input id="analytics-search" type="search" placeholder="Search by page name or route" list="analytics-search-suggestions" autocomplete="off" />
          </label>
          <div class="analytics-toolbar-meta">
            <label class="analytics-sort">
              <span class="analytics-search-label">Sort by</span>
              <select id="analytics-sort">
                <option value="views-desc">Views</option>
                <option value="time-desc">Avg active time</option>
                <option value="label-asc">Page name</option>
                <option value="route-asc">Route</option>
              </select>
            </label>
            <p class="analytics-search-count" id="analytics-search-count">Loading pages...</p>
          </div>
        </div>
        <datalist id="analytics-search-suggestions"></datalist>
        <div class="analytics-table-wrap">
          <div class="analytics-table" role="table" aria-label="Tracked page analytics">
            <div class="analytics-table-head" role="rowgroup">
              <div class="analytics-table-row analytics-table-row-head" role="row">
                <button class="analytics-head-cell analytics-head-page" type="button" data-sort="label-asc">Page</button>
                <button class="analytics-head-cell analytics-head-route" type="button" data-sort="route-asc">Route</button>
                <button class="analytics-head-cell analytics-head-views" type="button" data-sort="views-desc">Views</button>
                <button class="analytics-head-cell analytics-head-time" type="button" data-sort="time-desc">Avg active time</button>
              </div>
            </div>
            <div class="analytics-list" id="analytics-list" role="rowgroup"></div>
          </div>
        </div>
        <p class="analytics-error" id="analytics-error" hidden>Analytics could not be loaded right now.</p>
      </section>
    </main>
  </div>
  <script>
    (() => {
      const activeBucketSeconds = 10;
      const dashboards = [{"id":"portfolio","label":"Portfolio","namespace":"felip-eu-portfolio","note":"This is a lightweight pageview tracker for the portfolio and its project pages. Counts update as pages are visited, project modals are opened from the homepage, and average active time is estimated in 10-second buckets while a page stays visible.","pages":[{"label":"Home","route":"/"},{"label":"Analytics","route":"/analytics/"},{"label":"Beatbox","route":"/beatbox/"},{"label":"Canvas App","route":"/canvas-app/"},{"label":"CodePlayer","route":"/codeplayer/"},{"label":"Felipeu","route":"/felipeu/"},{"label":"Mixology Cards","route":"/mixology-cards/"},{"label":"Quote Machine","route":"/quote-machine/"},{"label":"Sunny Dublin","route":"/sunny-dublin/"},{"label":"Pension account","route":"/projects/pension-account/"},{"label":"Savings account","route":"/projects/savings-account/"},{"label":"Open Banking","route":"/projects/open-banking/"},{"label":"Discovery missions","route":"/projects/discovery-missions/"},{"label":"Dimply admin (sample)","route":"/projects/dimply-admin-old-sample/"},{"label":"Dimply (preview)","route":"/projects/dimply-preview/"},{"label":"Mortgage Viewer","route":"/projects/mortgage-viewer/"},{"label":"Gmail for work","route":"/projects/gmail-for-work/"},{"label":"Apple Health - Improve DAU","route":"/projects/apple-health-improve-dau/"},{"label":"Ryanair Rooms","route":"/projects/ryanair-rooms/"},{"label":"Aer Lingus","route":"/projects/aer-lingus/"},{"label":"Small Animations","route":"/projects/small-animations/"},{"label":"e-commerce","route":"/projects/e-commerce/"},{"label":"Customer Portal","route":"/projects/customer-portal/"},{"label":"A/B Testing","route":"/projects/ab-testing/"},{"label":"API documentation","route":"/projects/api-documentation/"},{"label":"Body illustrations","route":"/projects/body-illustrations/"},{"label":"e-Book","route":"/projects/e-book/"},{"label":"Cart","route":"/projects/cart/"},{"label":"LGC Blog Illustrations","route":"/projects/lgc-blog-illustrations/"},{"label":"Small animations","route":"/projects/small-animations-1/"},{"label":"Digital Painting","route":"/projects/digital-painting/"},{"label":"Ryanair X","route":"/projects/ryanair-x/"},{"label":"Admin Dashboard","route":"/projects/admin-dashboard/"},{"label":"Admin dashboard","route":"/projects/prototyping/"},{"label":"Branding Escola Vila Alpha","route":"/projects/branding-escola-vila-alpha/"},{"label":"icons","route":"/projects/icons/"},{"label":"TCAS Online #concept","route":"/projects/tcas-online-concept/"},{"label":"Daily UI","route":"/projects/daily-ui/"},{"label":"Music Matters - Mokation","route":"/projects/music-matters-mokation/"},{"label":"Magic Photo Gifts","route":"/projects/magic-photo-gifts/"},{"label":"David Plaza Hotel","route":"/projects/david-plaza-hotel/"},{"label":"Equiposhop","route":"/projects/equiposhop/"},{"label":"Cardelli in concert","route":"/projects/cardelli-in-concert/"},{"label":"Agro Ravena Refresh","route":"/projects/agro-ravena-refresh/"},{"label":"Logofolio","route":"/projects/logofolio/"},{"label":"CI - exchange","route":"/projects/ci-exchange/"},{"label":"E-Cadeiras presentation video","route":"/projects/e-cadeiras-presentation-video/"},{"label":"Photo Restoration","route":"/projects/photo-restoration/"}]},{"id":"sunnypubs","label":"Sunny Pubs","namespace":"sunnypubs-ie","note":"This keeps the sunnypubs.ie traffic separate from the portfolio while still making it easy to review from the same dashboard.","pages":[{"label":"Sunny Pubs Home","route":"/"}]}];
      const noteEl = document.getElementById("analytics-note");
      const viewsEl = document.getElementById("analytics-views");
      const totalEl = document.getElementById("analytics-total");
      const listEl = document.getElementById("analytics-list");
      const errorEl = document.getElementById("analytics-error");
      const searchEl = document.getElementById("analytics-search");
      const sortEl = document.getElementById("analytics-sort");
      const searchCountEl = document.getElementById("analytics-search-count");
      const searchSuggestionsEl = document.getElementById("analytics-search-suggestions");
      const sortButtons = Array.from(document.querySelectorAll("[data-sort]"));
      const dashboardMap = new Map(dashboards.map((dashboard) => [dashboard.id, dashboard]));
      let currentDashboardId = dashboards[0]?.id || "portfolio";
      let analyticsRows = [];
      let currentSort = "views-desc";

      function counterName(route) {
        const normalized = (route || "/").replace(/\/index\.html$/, "/").replace(/\/+/g, "/");
        if (normalized === "/" || normalized === "") return "home";
        const routeWithSlash = normalized.endsWith("/") ? normalized : normalized + "/";
        return routeWithSlash
          .replace(/^\//, "")
          .replace(/\/$/, "")
          .toLowerCase()
          .replace(/[^a-z0-9/_-]+/g, "-")
          .replace(/\//g, "__");
      }

      function fetchCount(namespace, route) {
        const url =
          "https://api.counterapi.dev/v1/" +
          encodeURIComponent(namespace) +
          "/" +
          encodeURIComponent(counterName(route)) +
          "/";

        return fetch(url)
          .then((response) => {
            if (response.status === 400) return { count: 0 };
            if (!response.ok) throw new Error("Bad response");
            return response.json();
          })
          .then((json) => Number(json.count || 0));
      }

      function fetchActiveBuckets(namespace, route) {
        const url =
          "https://api.counterapi.dev/v1/" +
          encodeURIComponent(namespace) +
          "/" +
          encodeURIComponent(counterName(route) + "__active") +
          "/";

        return fetch(url)
          .then((response) => {
            if (response.status === 400) return { count: 0 };
            if (!response.ok) throw new Error("Bad response");
            return response.json();
          })
          .then((json) => Number(json.count || 0));
      }

      function formatDuration(seconds) {
        const rounded = Math.max(0, Math.round(seconds));
        if (!rounded) return "0s";
        const minutes = Math.floor(rounded / 60);
        const remainder = rounded % 60;
        if (!minutes) return remainder + "s";
        if (!remainder) return minutes + "m";
        return minutes + "m " + remainder + "s";
      }

      function escapeText(value) {
        return String(value).replace(/[&<>"]/g, (char) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[char]));
      }

      function renderList(items) {
        listEl.innerHTML = items
          .map(
            (item) =>
              '<div class="analytics-table-row analytics-item" role="row">' +
                '<div class="analytics-cell analytics-cell-page" role="cell">' +
                  '<p class="analytics-item-label">' + escapeText(item.label) + '</p>' +
                '</div>' +
                '<div class="analytics-cell analytics-cell-route" role="cell">' +
                  '<p class="analytics-item-route">' + escapeText(item.route) + '</p>' +
                '</div>' +
                '<div class="analytics-cell analytics-cell-views" role="cell">' +
                  '<strong>' + item.count.toLocaleString() + '</strong>' +
                '</div>' +
                '<div class="analytics-cell analytics-cell-time" role="cell">' +
                  '<p class="analytics-item-meta">' + formatDuration(item.averageSeconds) + '</p>' +
                '</div>' +
              '</div>'
          )
          .join("");
      }

      function currentDashboard() {
        return dashboardMap.get(currentDashboardId) || dashboards[0];
      }

      function sortRows(items) {
        const rows = items.slice();
        const comparators = {
          "views-desc": (a, b) => b.count - a.count || b.averageSeconds - a.averageSeconds || a.label.localeCompare(b.label),
          "time-desc": (a, b) => b.averageSeconds - a.averageSeconds || b.count - a.count || a.label.localeCompare(b.label),
          "label-asc": (a, b) => a.label.localeCompare(b.label) || b.count - a.count,
          "route-asc": (a, b) => a.route.localeCompare(b.route) || b.count - a.count
        };

        return rows.sort(comparators[currentSort] || comparators["views-desc"]);
      }

      function syncSortUi() {
        sortEl.value = currentSort;
        sortButtons.forEach((button) => {
          button.setAttribute("aria-pressed", button.dataset.sort === currentSort ? "true" : "false");
        });
      }

      function syncDashboardUi() {
        const dashboard = currentDashboard();
        noteEl.textContent = dashboard?.note || "";
        viewsEl.innerHTML = dashboards
          .map(
            (dashboardItem) =>
              '<button class="analytics-view-tab" type="button" role="tab" aria-selected="' +
              String(dashboardItem.id === currentDashboardId) +
              '" data-dashboard="' +
              escapeText(dashboardItem.id) +
              '">' +
              escapeText(dashboardItem.label) +
              "</button>"
          )
          .join("");
        viewsEl.querySelectorAll("[data-dashboard]").forEach((button) => {
          button.addEventListener("click", () => {
            const nextId = button.dataset.dashboard;
            if (!nextId || nextId === currentDashboardId) return;
            currentDashboardId = nextId;
            searchEl.value = "";
            errorEl.hidden = true;
            totalEl.textContent = "...";
            searchCountEl.textContent = "Loading pages...";
            listEl.innerHTML = "";
            syncDashboardUi();
            loadDashboard();
          });
        });
      }

      function updateSearchResults() {
        const query = (searchEl.value || "").trim().toLowerCase();
        const filtered = !query
          ? analyticsRows
          : analyticsRows.filter((item) =>
              item.label.toLowerCase().includes(query) || item.route.toLowerCase().includes(query)
            );

        renderList(sortRows(filtered));
        searchCountEl.textContent =
          filtered.length === analyticsRows.length
            ? analyticsRows.length + " pages"
            : filtered.length + " of " + analyticsRows.length + " pages";
      }

      function loadDashboard() {
        const dashboard = currentDashboard();
        if (!dashboard) return;

        Promise.all(
          dashboard.pages.map(async (page) => ({
            ...page,
            count: await fetchCount(dashboard.namespace, page.route)
          }))
        )
          .then((results) =>
            Promise.all(
              results.map(async (item) => ({
                ...item,
                activeBuckets: item.count ? await fetchActiveBuckets(dashboard.namespace, item.route) : 0
              }))
            )
          )
          .then((results) => {
            const sorted = results
              .map((item) => ({
                ...item,
                averageSeconds: item.count ? (item.activeBuckets * activeBucketSeconds) / item.count : 0
              }))
              .sort((a, b) => b.count - a.count || a.label.localeCompare(b.label));
            const total = sorted.reduce((sum, item) => sum + item.count, 0);
            analyticsRows = sorted;
            totalEl.textContent = total.toLocaleString();
            searchSuggestionsEl.innerHTML = sorted
              .map((item) => '<option value="' + escapeText(item.label) + '"></option><option value="' + escapeText(item.route) + '"></option>')
              .join("");
            syncSortUi();
            updateSearchResults();
          })
          .catch(() => {
            analyticsRows = [];
            totalEl.textContent = "--";
            errorEl.hidden = false;
            searchCountEl.textContent = "Analytics unavailable";
          });
      }

      syncDashboardUi();
      searchEl.addEventListener("input", updateSearchResults);
      sortEl.addEventListener("change", () => {
        currentSort = sortEl.value;
        syncSortUi();
        updateSearchResults();
      });
      sortButtons.forEach((button) => {
        button.addEventListener("click", () => {
          currentSort = button.dataset.sort || "views-desc";
          syncSortUi();
          updateSearchResults();
        });
      });
      loadDashboard();
    })();
  </script>

    
    <script>
      (() => {
        const namespace = "felip-eu-portfolio";
        const trackedRoutes = new Set();

        function normalizeRoute(route) {
          const trimmed = (route || "/").replace(/\/index\.html$/, "/").replace(/\/+/g, "/");
          if (trimmed === "/" || trimmed === "") return "/";
          return trimmed.endsWith("/") ? trimmed : trimmed + "/";
        }

        function counterName(route) {
          const normalized = normalizeRoute(route);
          if (normalized === "/") return "home";
          return normalized
            .replace(/^\//, "")
            .replace(/\/$/, "")
            .toLowerCase()
            .replace(/[^a-z0-9/_-]+/g, "-")
            .replace(/\//g, "__");
        }

        function activeCounterName(route) {
          return counterName(route) + "__active";
        }

        function pingCounter(name) {
          const url =
            "https://api.counterapi.dev/v1/" +
            encodeURIComponent(namespace) +
            "/" +
            encodeURIComponent(name) +
            "/up";

          fetch(url, { method: "GET", keepalive: true }).catch(() => {});
        }

        const activeBucketMs = 10 * 1000;
        let activeRoute = null;
        let activeStartedAt = 0;
        let activeCarryMs = 0;
        let activeTimer = null;

        function flushActiveTime(finalize = false) {
          if (!activeRoute || !activeStartedAt) return;

          const now = Date.now();
          activeCarryMs += Math.max(0, now - activeStartedAt);
          activeStartedAt = now;

          while (activeCarryMs >= activeBucketMs) {
            pingCounter(activeCounterName(activeRoute));
            activeCarryMs -= activeBucketMs;
          }

          if (finalize && activeCarryMs >= activeBucketMs / 2) {
            pingCounter(activeCounterName(activeRoute));
            activeCarryMs = 0;
          }
        }

        function stopActiveTimer(finalize = false) {
          flushActiveTime(finalize);
          activeStartedAt = 0;
          if (activeTimer) {
            clearInterval(activeTimer);
            activeTimer = null;
          }
        }

        function ensureActiveTimer() {
          if (document.visibilityState !== "visible" || activeTimer) return;
          activeTimer = setInterval(() => flushActiveTime(false), activeBucketMs);
        }

        function setActiveRoute(route) {
          const normalized = normalizeRoute(route);
          const changedRoute = activeRoute !== normalized;

          if (changedRoute) {
            stopActiveTimer(true);
            activeRoute = normalized;
            activeCarryMs = 0;
          }

          if (document.visibilityState === "visible") {
            activeStartedAt = Date.now();
            ensureActiveTimer();
          }
        }

        function trackPageView(route) {
          const normalized = normalizeRoute(route);
          if (!trackedRoutes.has(normalized)) {
            trackedRoutes.add(normalized);
            pingCounter(counterName(normalized));
          }

          setActiveRoute(normalized);
        }

        window.__FS_ANALYTICS__ = {
          namespace,
          trackPageView,
          setActiveRoute
        };

        document.addEventListener("visibilitychange", () => {
          if (document.visibilityState === "hidden") {
            stopActiveTimer(true);
            return;
          }

          if (activeRoute) {
            activeStartedAt = Date.now();
            ensureActiveTimer();
          }
        });

        window.addEventListener("pagehide", () => stopActiveTimer(true));

        trackPageView(window.location.pathname);
      })();
    </script>
  
  </body>
</html>
